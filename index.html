<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Shoe Company</title>
  <style>
    /* Global Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Printed Graphic Background Setup */
    body {
      color: #1a1a1a;
      min-height: 100vh;
      
      /* Subtle geometric streetwear printed pattern using pure CSS */
      background-color: #0f1115;
      background-image: 
        radial-gradient(circle at 25px 25px, rgba(255, 255, 255, 0.08) 2%, transparent 0%), 
        radial-gradient(circle at 75px 75px, rgba(255, 255, 255, 0.05) 2%, transparent 0%),
        linear-gradient(135deg, rgba(255,255,255,0.03) 25%, transparent 25%),
        linear-gradient(225deg, rgba(255,255,255,0.03) 25%, transparent 25%);
      background-size: 100px 100px, 100px 100px, 40px 40px, 40px 40px;
      background-attachment: fixed;
    }

    /* Header & Branding */
    header {
      text-align: center;
      padding: 50px 20px 30px;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    header p {
      color: #9ca3af;
      margin-top: 8px;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    /* Product Grid Layout */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 20px 60px;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    /* Product Cards with Solid Backdrop */
    .shoe-card {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .shoe-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.5);
    }

    .image-box {
      width: 100%;
      height: 240px;
      background: #f1f3f5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .shoe-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .shoe-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 6px;
    }

    .shoe-category {
      font-size: 0.85rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .shoe-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #f3f4f6;
    }

    .shoe-price {
      font-size: 1.3rem;
      font-weight: 800;
      color: #000000;
    }

    .btn-buy {
      background: #111827;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-buy:hover {
      background: #2563eb;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 30px 20px;
      color: #6b7280;
      font-size: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <h1>The Shoe Company</h1>
    <p>Premium & Exclusive Footwear Collection</p>
  </header>

  <!-- Shoe Catalog Grid -->
  <div class="container">
    <div class="catalog-grid">

      <!-- Item 1 -->
      <div class="shoe-card">
        <div class="image-box">
          <!-- Replace shoe1.jpg with your image filename -->
          <img src="shoe1.jpg" alt="Sneaker Model 1" onerror="this.src='https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&q=80'" />
        </div>
        <div class="shoe-info">
          <div>
            <div class="shoe-category">Running / Lifestyle</div>
            <div class="shoe-title">Air Sport Edition</div>
          </div>
          <div class="shoe-bottom">
            <span class="shoe-price">₹4,999</span>
            <a href="#" class="btn-buy">Inquire / Buy</a>
          </div>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="shoe-card">
        <div class="image-box">
          <!-- Replace shoe2.jpg with your image filename -->
          <img src="shoe2.jpg" alt="Sneaker Model 2" onerror="this.src='https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=600&q=80'" />
        </div>
        <div class="shoe-info">
          <div>
            <div class="shoe-category">Streetwear</div>
            <div class="shoe-title">Retro High Top</div>
          </div>
          <div class="shoe-bottom">
            <span class="shoe-price">₹6,499</span>
            <a href="#" class="btn-buy">Inquire / Buy</a>
          </div>
        </div>
      </div>

      <!-- Item 3 -->
      <div class="shoe-card">
        <div class="image-box">
          <!-- Replace shoe3.jpg with your image filename -->
          <img src="shoe3.jpg" alt="Sneaker Model 3" onerror="this.src='https://images.unsplash.com/photo-1552346154-21d32810aba3?w=600&q=80'" />
        </div>
        <div class="shoe-info">
          <div>
            <div class="shoe-category">Classics</div>
            <div class="shoe-title">Urban Minimalist</div>
          </div>
          <div class="shoe-bottom">
            <span class="shoe-price">₹3,999</span>
            <a href="#" class="btn-buy">Inquire / Buy</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 The Shoe Company. All Rights Reserved.</p>
  </footer>

</body>
</html>
